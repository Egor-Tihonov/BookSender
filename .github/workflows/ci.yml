# ci.yml — GitHub Actions.
#
# lint и test бегут только на pull request, один раз на коммит.
# Мерж в main закрыт защитой ветки: без зелёных lint и test кнопка мержа
# недоступна, прямой пуш в main запрещён (Settings → Branches).
#
# deploy запускается, когда pull request закрыт мержем в main,
# и не повторяет проверки: они уже прошли на этом pull request.
# Делает redeploy существующего сервиса Koyeb, образ Koyeb собирает сам.
# Переменные окружения сервиса при этом не трогаются.
#
# Нужно задать в Settings → Secrets and variables → Actions:
#   secret   KOYEB_TOKEN    — API ключ Koyeb
#   variable KOYEB_APP      — имя приложения в Koyeb
#   variable KOYEB_SERVICE  — имя сервиса в Koyeb

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "не отформатированы gofmt:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test
        run: go test -race ./...

  deploy:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: install koyeb cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> "$GITHUB_PATH"
      - name: redeploy
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb services redeploy "${{ vars.KOYEB_SERVICE }}" \
            --app "${{ vars.KOYEB_APP }}" \
            --wait --wait-timeout 10m
